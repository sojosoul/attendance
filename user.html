<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi — Sistem Presensi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>📋 Presensi</h1>
    <div class="wallet-info" id="walletInfo">Menghubungkan...</div>
</header>

<div class="container">

    <!-- INFO PENGGUNA -->
    <div class="card">
        <div style="display:flex;align-items:center;gap:16px;">
            <div style="font-size:40px">👤</div>
            <div>
                <div style="font-weight:700;font-size:16px" id="userNama">-</div>
                <div class="text-soft" id="userID">-</div>
                <div class="text-soft" style="font-size:12px" id="userWallet">-</div>
            </div>
        </div>
    </div>

    <!-- STATUS HARI INI -->
    <div class="card" id="statusCard">
        <div class="card-title">Status Hari Ini — <span id="tanggalHariIni"></span></div>
        <div class="grid-2">
            <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px;">
                <div style="font-size:28px" id="iconCI">⏳</div>
                <div style="font-weight:600;margin-top:4px">Check-In</div>
                <div class="text-soft" style="font-size:12px" id="waktuCI">Belum</div>
            </div>
            <div style="text-align:center;padding:16px;background:var(--bg);border-radius:8px;">
                <div style="font-size:28px" id="iconCO">⏳</div>
                <div style="font-weight:600;margin-top:4px">Check-Out</div>
                <div class="text-soft" style="font-size:12px" id="waktuCO">Belum</div>
            </div>
        </div>
    </div>

    <!-- AREA PRESENSI -->
    <div class="card" id="cardPresensi">
        <div class="card-title" id="judulPresensi">Lakukan Presensi</div>

        <!-- Step 1: Pilih aksi -->
        <div id="stepPilih">
            <div class="grid-2">
                <button class="btn btn-success" id="btnCI" onclick="kirimPresensi()">
                    ✅ Check-In
                </button>
                <button class="btn btn-primary" id="btnCO" onclick="kirimPresensi()">
                    🏁 Check-Out
                </button>
            </div>
        </div>

        <!-- Step 5: Sukses -->
        <div id="stepSukses" class="hidden">
            <div class="status-box">
                <div class="status-icon">🎉</div>
                <div class="status-text" id="suksesJudul">Presensi Berhasil!</div>
                <div class="status-sub" id="suksesSub"></div>
            </div>
            <button class="btn btn-gray mt-16" onclick="resetPresensi()">🔄 Kembali</button>
        </div>

    </div>

    <!-- RIWAYAT PRESENSI -->
    <!-- <div class="card">
        <div class="card-title">Riwayat Presensi Saya</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Check-In</th>
                        <th>Check-Out</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="riwayatBody">
                    <tr><td colspan="5" class="text-center text-soft" style="padding:20px">Memuat riwayat...</td></tr>
                </tbody>
            </table>
        </div>
    </div> -->

</div>

<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="js/config.js"></script>
<script src="js/web3-init.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
